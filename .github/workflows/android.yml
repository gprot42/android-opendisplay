# Build + unit-test the Android receiver on every change under Android/.
# This catches API/compile regressions; full multi-API smoke is still manual
# (see Android/README.md).

name: Android

on:
  push:
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
      - "WIRE.md"
  pull_request:
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
      - "WIRE.md"

jobs:
  build:
    name: unit tests + assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
